<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Debrato Ghosh — software systems, computer vision research, photography and astronomy."
    />
    <meta name="theme-color" content="#fbf8ff" />
    <link
      rel="preload"
      href="/fonts/roboto-flex-latin-wdth.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>Debrato Ghosh — Developer & Researcher</title>
    <script>
      (function () {
        var root = document.documentElement;
        var dark = matchMedia('(prefers-color-scheme: dark)').matches;
        try {
          var saved = localStorage.getItem('portfolio-theme');
          root.dataset.theme =
            saved === 'light' || saved === 'dark'
              ? saved
              : dark
                ? 'dark'
                : 'light';
          var sky = localStorage.getItem('portfolio-sky');
          root.dataset.seed =
            sky && /^(twilight|aurora|nebula|golden-hour)$/.test(sky)
              ? sky
              : sky && /^#[0-9a-f]{6}$/i.test(sky)
                ? 'custom'
                : 'twilight';
        } catch {
          root.dataset.theme = dark ? 'dark' : 'light';
          root.dataset.seed = 'twilight';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
