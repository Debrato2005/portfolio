<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Debrato Ghosh — IT student at MIT Manipal and research intern in 2D/3D computer vision. Backend systems, projects, research and astrophotography."
    />
    <meta name="theme-color" content="#e6e0d3" />
    <title>Debrato Ghosh — Portfolio</title>
    <script>
      (function () {
        var root = document.documentElement;
        var dark = matchMedia('(prefers-color-scheme: dark)').matches;
        var theme = dark ? 'dark' : 'light';
        try {
          var saved = localStorage.getItem('portfolio-theme');
          if (saved === 'light' || saved === 'dark') theme = saved;
        } catch {
          // Storage can be blocked; fall back to the system preference.
        }
        root.dataset.theme = theme;
        if (theme === 'dark')
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute('content', '#1b1915');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
